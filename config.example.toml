# luckfind configuration — example.
#
# Auto-discovered in the current working directory when `--config` is not
# given: `luckfind.toml` first, then `config.toml`.  So just dropping a file
# named `config.toml` next to the binary and running `./luckfind` picks it up:
#
#   cp config.example.toml bin/config.toml && cd bin && ./luckfind
#
# Or point at a specific file with `bin/luckfind --config config.example.toml`.
#
# Precedence: command-line flags override values in this file, which override
# built-in defaults.  Every key is optional; only set what you need.

# ── mode ────────────────────────────────────────────────────────────────────
# Which scan mode to run:
#   "random" (default) — lottery scan against the embedded 77-puzzle set
#   "puzzle"           — deterministic sub-range scan; requires [puzzle]
#   "remote"           — claim chunks from a LAN hub; requires [remote]
mode = "remote"

# ── rotation (reclaim) budgets ──────────────────────────────────────────────
# Puzzle-mode per-claim rotation budgets: how many keys a worker scans before
# parking its chunk (saving position) and claiming a fresh random one.  These
# are the reclaim counts — smaller = more frequent jumps back to the worklist.
#   cpu_rotate_keys = 134217728    # 2^27  (default)
#   gpu_rotate_keys = 2147483648   # 2^31  (default)
# A value of 0 disables rotation (scan each chunk to completion).
# cpu_rotate_keys = 134217728
# gpu_rotate_keys = 4294967296

[btc]
# 检查压缩公钥和非压缩公钥
check_compressed_pk = true
check_uncompressed_pk = false

# ── CPU workers ──────────────────────────────────────────────────────────────
# `enabled` toggles CPU scanning entirely (default true).  `load` is the
# proportion (0.1 ..= 1.0) of the resolved worker thread count that actually
# runs — the base is `--workers`, defaulting to ALL logical CPUs, so the
# default run uses num_cpus × load threads.  1.0 = all cores, 0.5 = half, and
# so on.  A machine shared with other work can set load < 1 to leave cores idle.
[cpu]
enabled = true
load = 0.5

# ── GPU collision scanning ───────────────────────────────────────────────────
# `enabled` (default true) gates whether the GPU is used for hashing/collision
# at all.  The GPU is engaged only when this is true AND a device is actually
# available (`--gpu_framework auto` probes CUDA, then WebGPU).  Setting it to
# false forces a CPU-only run even on a GPU box.
[gpu]
enabled = true

# ── pubkey serialisations to check ───────────────────────────────────────────
# Which forms of the public key the scan compares against the target hash160.
# A puzzle address may have been derived from either the compressed (33-byte)
# or the uncompressed (65-byte) serialisation, so both default to true.  Setting
# one to false skips that form's serialize + hash160 entirely on the CPU and GPU
# hot paths — a useful win when you know the target only ever used one form.
# At least one must remain enabled (both false is a config error, exit 2).
[btc]
check_compressed_pk = true
check_uncompressed_pk = true

# ── mode = "puzzle" ─────────────────────────────────────────────────────────
# Required when mode = "puzzle".  Path to the worklist (.db runtime format,
# or .json one-time import).
# [puzzle]
# database = "bin/71.db"

# ── mode = "remote" ─────────────────────────────────────────────────────────
# Required when mode = "remote".  Hub base URL.
[remote]
uri = "http://192.168.18.69:42069"
# 本地 Nostr 身份文件（启动 auth 用，声明 client pubkey + 解开 hub 信封）。
# 缺省 = 本目录 identity.json（与 config 自动发现同 cwd 语义）。
# identity = "identity.json"
#
# hub 身份钉扎摘要 = sha256(hub 的 npub 文本)，小写 hex；取自 hub 机
# backend/data/identity.json 的 npub_sha256 字段（`scripts/nostr.py -f <file> verify`
# 可校验该文件自洽）。auth 拿到 hub 公钥后转 npub 算摘要比对，不符即 exit 2。
# **有 identity 文件时必须配**（缺失 → exit 2，fail closed）；匿名轨不需要。
npub_sha256 = "709036f6387523b2203bc46047a2f13383e5ec48e86a64ddbada2a776cc00c55"
